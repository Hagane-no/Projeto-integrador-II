<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Confiro Já{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .btn-audio-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1050;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            <i class="bi bi-box-seam me-2"></i>Confiro Já
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'gerenciar_produtos' %}"><i class="bi bi-box me-1"></i> Produtos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'gerenciar_categorias' %}"><i class="bi bi-tags me-1"></i> Categorias</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'reposicao_estoque' %}"><i class="bi bi-arrow-left-right me-1"></i> Movimentações</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'historico' %}"><i class="bi bi-clock-history me-1"></i> Histórico</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-white">
                <span class="me-3"><i class="bi bi-person-circle me-1"></i> {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Sair</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<!-- Botão Flutuante do Leitor de Voz -->
<button type="button" id="btnAudioTTS" class="btn btn-primary btn-audio-float" onclick="falarConteudoPagina()" title="Ouvir Conteúdo da Página">
    <i class="bi bi-mega-phone-fill fs-4" id="iconTTS"></i>
</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let synth = window.speechSynthesis;
    let isSpeaking = false;

    function falarConteudoPagina() {
        if (isSpeaking) {
            synth.cancel();
            isSpeaking = false;
            document.getElementById('iconTTS').className = 'bi bi-mega-phone-fill fs-4';
            return;
        }

        let texto = document.body.innerText;
        let utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';

        utterance.onend = function() {
            isSpeaking = false;
            document.getElementById('iconTTS').className = 'bi bi-mega-phone-fill fs-4';
        };

        synth.speak(utterance);
        isSpeaking = true;
        document.getElementById('iconTTS').className = 'bi bi-square-fill fs-4';
    }
</script>
</body>
</html>
