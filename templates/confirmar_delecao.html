<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confiro Já - Confirmar Exclusão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container" style="max-width: 500px;">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill display-1"></i>
            </div>
            <h4 class="fw-bold mb-2">Confirmar Exclusão</h4>
            <p class="text-muted">Tem certeza de que deseja excluir o(a) {{ tipo }} <strong>"{{ objeto }}"</strong>? Esta ação não pode ser desfeita.</p>
            
            <form method="POST" class="d-flex justify-content-center gap-2 mt-3">
                {% csrf_token %}
                <a href="javascript:history.back()" class="btn btn-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-danger px-4 fw-bold">Excluir</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
