<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Confiro Já</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">📦 Confiro Já</h2>
                        <p class="text-muted">Acesse a sua conta para continuar</p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label font-semibold">Utilizador</label>
                            <input type="text" name="username" class="form-control" placeholder="Digite seu nome de utilizador" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Palavra-passe</label>
                            <input type="password" name="password" class="form-control" placeholder="Digite sua palavra-passe" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Entrar</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Ainda não tem acesso?</p>
                        <a href="{% url 'register' %}" class="fw-bold text-decoration-none">Criar Novo Usuário</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
